[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "augmentworks-target"
version = "0.1.0a1"
description = "Python SDK and language-neutral reverse API protocol for AugmentWorks evaluation targets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "AugmentWorks" },
]
keywords = ["ai", "evals", "llm", "testing", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.111,<1",
]
dev = [
  "build>=1.2,<2",
  "fastapi>=0.111,<1",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
augmentworks-target = "augmentworks_target.cli:main"

[project.urls]
Homepage = "https://github.com/jeffskafi/augmentworks-target"
Issues = "https://github.com/jeffskafi/augmentworks-target/issues"
Repository = "https://github.com/jeffskafi/augmentworks-target"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/spec",
  "/examples",
  "/tests",
  "/LICENSE",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/augmentworks_target"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["augmentworks_target"]

[tool.coverage.report]
show_missing = true
skip_covered = true
